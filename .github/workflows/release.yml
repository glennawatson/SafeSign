name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag. Pick one, unless versionOverride is set.'
        required: true
        type: choice
        options:
        - '(pick one)'
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). The version becomes <bumped-core>-<channel>.<N>. Empty = stable release.'
        required: false
        type: string
        default: ''
      versionOverride:
        description: 'Exact version to release (e.g. 4.2.5, tagged v4.2.5), bypassing the bump from the latest tag. Leave bump at "(pick one)".'
        required: false
        type: string
        default: ''
      sourceRef:
        description: 'Git ref (tag, branch or SHA) to release from. Empty = the ref this run was started on.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver2: ${{ steps.minver.outputs.SemVer2 }}
      tag: ${{ steps.tagname.outputs.tag }}
      prerelease: ${{ steps.tagname.outputs.prerelease }}
      sourceSha: ${{ steps.sourcesha.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.sourceRef }}
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
      with:
        dotnet-versions: |
          10.0.x
          11.0.x
        minver-tag-prefix: 'v'
        minver-auto-increment: 'minor'
        stamp-version: 'false'
    - name: Resolve built commit SHA
      id: sourcesha
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: resolve-built-commit-sha-c775df1621.cs
    - name: Validate version inputs
      env:
        BUMP: ${{ inputs.bump }}
        PRE_RELEASE: ${{ inputs.preRelease }}
        VERSION_OVERRIDE: ${{ inputs.versionOverride }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: validate-version-inputs-a975ecb49d.cs
    - name: Compute version and tag
      if: inputs.bump != '(pick one)' && inputs.versionOverride == ''
      id: bump
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@main
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: 'v'
        pre-release-id: ${{ inputs.preRelease }}
        push-tag: 'false'
    - name: Resolve release tag
      id: tagname
      env:
        BUMP_TAG: ${{ steps.bump.outputs.tag }}
        BUMP_PRERELEASE: ${{ steps.bump.outputs.prerelease }}
        VERSION_OVERRIDE: ${{ inputs.versionOverride }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: resolve-release-tag-de4aae5558.cs
    - name: Stamp version with MinVer
      id: minver
      uses: glennawatson/actions-common/.github/actions/minver@main
      with:
        tag-prefix: 'v'
        auto-increment: 'minor'
        version-override: ${{ inputs.versionOverride != '' && inputs.versionOverride || steps.bump.outputs.version }}
    - name: Build
      uses: glennawatson/actions-common/.github/actions/dotnet-build@main
      with:
        solution-file: SafeSign.slnx
    - name: Pack NuGet packages
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: dotnet
        arguments: |-
          pack
          SafeSign.slnx
          --no-build
          --configuration
          Release
          -o
          ${GITHUB_WORKSPACE}/packages
        working-directory: src
    - name: Upload unsigned packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: unsigned-nuget
        path: packages/*.nupkg
        if-no-files-found: error
  publish-aot:
    needs: build
    name: Publish Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.sourceRef }}
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
      with:
        dotnet-versions: |
          10.0.x
          11.0.x
        minver-tag-prefix: 'v'
        minver-auto-increment: 'minor'
        stamp-version: 'false'
    - name: Publish Native AOT (net11.0)
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: dotnet
        arguments: |-
          publish
          src/SafeSign/SafeSign.csproj
          --configuration
          Release
          --framework
          net11.0
          --runtime
          ${{ matrix.rid }}
          -p:PublishAot=true
          -p:Version=${{ needs.build.outputs.semver2 }}
          -p:MinVerVersionOverride=${{ needs.build.outputs.semver2 }}
          --output
          ${GITHUB_WORKSPACE}/aot/${{ matrix.rid }}
        working-directory: .
    - name: Upload Native AOT binary (${{ matrix.rid }})
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: aot-${{ matrix.rid }}
        path: aot/${{ matrix.rid }}/*
        if-no-files-found: error
  sign:
    needs: [build, publish-aot]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      packages: read
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
    - name: Download unsigned packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: unsigned-nuget
        path: signed
    - name: Download Native AOT binary (linux-x64)
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: aot-linux-x64
        path: aot/linux-x64
    - name: Download Native AOT binary (win-x64)
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: aot-win-x64
        path: aot/win-x64
    - name: Mark SafeSign Linux Native AOT executable
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: chmod
        arguments: |-
          +x
          aot/linux-x64/SafeSign
        working-directory: .
    - name: Dogfood SafeSign to sign NuGet packages and Windows Native AOT executable with Certum SimplySign
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: bash
        arguments: |-
          -c
          ./aot/linux-x64/SafeSign sign signed/*.nupkg aot/win-x64/SafeSign.exe --provider certum --hash SHA256 --timestamp-url http://time.certum.pl --description SafeSign --description-url https://github.com/glennawatson/SafeSign
        working-directory: .
    - name: Upload signed packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: signed-nuget
        path: signed/*.nupkg
        if-no-files-found: error
    - name: Upload signed Windows Native AOT binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: signed-aot-win-x64
        path: aot/win-x64/*
        if-no-files-found: error
  publish-nuget:
    needs: [build, sign]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Setup .NET
      uses: glennawatson/actions-common/.github/actions/setup-sdk@main
      with:
        dotnet-version: 11.0.x
    - name: Download signed packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: signed-nuget
        path: signed
    - name: NuGet login (OIDC trusted publishing)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: push-to-nuget-d58e357f8c.cs
  create-release:
    needs: [build, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Setup .NET
      uses: glennawatson/actions-common/.github/actions/setup-sdk@main
      with:
        dotnet-version: 11.0.x
    - name: Download signed packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: signed-nuget
        path: signed
    - name: Download release notes
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-notes
        path: .
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ needs.build.outputs.tag }}
        TARGET: ${{ needs.build.outputs.sourceSha }}
        TITLE: ${{ needs.build.outputs.semver2 }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: create-github-release-54073718a8.cs
