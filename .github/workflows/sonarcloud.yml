name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Build, test, and analyze
    uses: glennawatson/actions-common/.github/workflows/workflow-common-sonarcloud.yml@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      solutionFile: SafeSign.slnx
      runsOn: ubuntu-latest
      minverTagPrefix: 'v'
      minverMinimumMajorMinor: '1.0'
      minverAutoIncrement: 'minor'
      sonarProjectKey: glennawatson_SafeSign
      sonarOrganization: glennawatson
      sonarExclusions: '**/tests/**,**/benchmarks/**'
      sonarCoverageExclusions: '**/tests/**,**/benchmarks/**'
      sonarCpdExclusions: '**/tests/**,**/benchmarks/**'
      sonarTestExclusions: '**/tests/**,**/benchmarks/**'
      dotnetVersions: |
        10.0.x
        11.0.x
