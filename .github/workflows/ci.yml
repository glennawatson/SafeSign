name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
    with:
      solutionFile: SafeSign.slnx
      minverTagPrefix: 'v'
      minverMinimumMajorMinor: '1.0'
      minverAutoIncrement: 'minor'
      uploadCodecov: false
      dotnetVersions: |
        10.0.x
        11.0.x

  publish-aot:
    name: Publish Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Environment
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
        with:
          stamp-version: 'false'
          dotnet-versions: |
            10.0.x
            11.0.x

      - name: Publish Native AOT (net11.0)
        run: dotnet publish src/SafeSign/SafeSign.csproj -c Release -f net11.0 -r "${{ matrix.rid }}" -p:PublishAot=true -o "aot/${{ matrix.rid }}"

      - name: Verify Native AOT binary
        shell: bash
        run: ./aot/${{ matrix.rid }}/SafeSign providers
