name: "CodeQL Advanced"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
  - cron: '17 9 * * 2'
permissions: {}
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze-csharp:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: read
      actions: read
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
      with:
        dotnet-versions: |
          10.0.x
          11.0.x
        minver-tag-prefix: 'v'
        minver-auto-increment: 'minor'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
      with:
        languages: csharp
        build-mode: manual
        queries: security-extended
    - name: Build
      uses: glennawatson/actions-common/.github/actions/dotnet-build@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
      with:
        solution-file: SafeSign.slnx
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
      with:
        category: "/language:csharp"
