name: "CodeQL Advanced"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 9 * * 2'

permissions:
  security-events: write
  contents: read
  packages: read
  actions: read

jobs:
  codeql:
    name: CodeQL
    uses: glennawatson/actions-common/.github/workflows/workflow-common-codeql.yml@4d538f76071ed73496cbf406cebe85e760fb734d # main
    with:
      solutionFile: SafeSign.slnx
      csharpRunsOn: ubuntu-latest
      dotnetVersions: |
        10.0.x
        11.0.x
